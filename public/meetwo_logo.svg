<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140" fill="none">
  <defs>
    <linearGradient id="meetwo_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="aperture_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Brand Mark (Left) -->
  <g transform="translate(20, 15)" filter="url(#glow)">
    <!-- Left Bubble -->
    <path d="M45 15 C20 15 5 32 5 55 C5 70 15 82 28 89 L24 105 L44 95 C49 96 52 96 55 96 C80 96 95 79 95 56 C95 33 80 15 55 15 Z"
          fill="none" stroke="url(#meetwo_grad)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Bubble (Interlocking) -->
    <path d="M65 15 C90 15 105 32 105 55 C105 70 95 82 82 89 L86 105 L66 95 C61 96 58 96 55 96 C30 96 15 79 15 56 C15 33 30 15 55 15 Z"
          fill="none" stroke="url(#meetwo_grad)" stroke-width="6" stroke-linejoin="round" opacity="0.85"/>

    <!-- Center Aperture / Lens Ring -->
    <circle cx="55" cy="55" r="20" fill="#0B0E14" stroke="url(#aperture_grad)" stroke-width="4.5"/>
    <!-- Shutter blades / pupil -->
    <circle cx="55" cy="55" r="8" fill="url(#meetwo_grad)"/>
    <path d="M45 47 L65 47 M48 64 L62 46 M62 64 L48 46" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark (Right) -->
  <text x="160" y="82" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">
    MEE<tspan fill="url(#meetwo_grad)">TWO</tspan>
  </text>
  <text x="164" y="104" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#64748B" text-transform="uppercase">
    REAL-TIME VIDEO PLATFORM
  </text>
</svg>
